name: Ohjaa GitHub Pages taskuministeri.fi-osoitteeseen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Sivu julkaistaan Cloudflare Pagesissa (taskuministeri.fi). GitHub Pagesissa on enää ohjaussivu,
      # joka vie vanhat linkit (myös #-skenaariot) uuteen osoitteeseen.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: gh-pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
