<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskuministeri on muuttanut: taskuministeri.fi</title>
    <link rel="canonical" href="https://taskuministeri.fi/" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=https://taskuministeri.fi/" />
    <script>
      // Säilytetään polku (ilman /taskuministeri-etuliitettä), kysely ja #-osa, jotta jaetut skenaariolinkit toimivat.
      var path = location.pathname.replace(/^\/taskuministeri/, "");
      location.replace("https://taskuministeri.fi" + (path || "/") + location.search + location.hash);
    </script>
  </head>
  <body style="font-family: system-ui, sans-serif; padding: 2rem">
    <p>Taskuministeri on muuttanut osoitteeseen <a href="https://taskuministeri.fi/">taskuministeri.fi</a>.</p>
  </body>
